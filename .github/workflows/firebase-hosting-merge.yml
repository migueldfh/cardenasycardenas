name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies and build
        run: bun install && bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ENABLE_INVENTORY: ${{ vars.VITE_ENABLE_INVENTORY }}
          VITE_ENABLE_ORDERS: ${{ vars.VITE_ENABLE_ORDERS }}
          VITE_ENABLE_FINANCES: ${{ vars.VITE_ENABLE_FINANCES }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARDENASYCARDENAS_1F626 }}
          channelId: live
          projectId: cardenasycardenas-1f626
